# NO CONFORME (solo viola disallow-privilege-escalation): el contenedor permite
# escalar privilegios (allowPrivilegeEscalation: true).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-privilege-escalation
  labels: { app: policy-test }
spec:
  replicas: 1
  selector:
    matchLabels: { app: policy-test }
  template:
    metadata:
      labels: { app: policy-test }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.29.3-alpine
          securityContext:
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
