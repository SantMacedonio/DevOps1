# NO CONFORME (solo viola disallow-latest-tag): imagen con la etiqueta latest.
# Usado por scripts/test-policies para demostrar que Kyverno lo rechaza.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-latest-tag
  labels: { app: policy-test }
spec:
  replicas: 1
  selector:
    matchLabels: { app: policy-test }
  template:
    metadata:
      labels: { app: policy-test }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
