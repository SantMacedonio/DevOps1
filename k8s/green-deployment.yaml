apiVersion: apps/v1
kind: Deployment
metadata:
  name: shape-game-green
  labels:
    app: shape-game
    version: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shape-game
      version: green
  template:
    metadata:
      labels:
        app: shape-game
        version: green
    spec:
      containers:
        - name: shape-game
          image: shape-game:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: APP_VERSION
              value: "v2.0.0"
            - name: APP_COLOR
              value: "green"
            - name: PRESTIGE_ENABLED
              value: "true"
            - name: REDIS_HOST
              value: "redis-service"
            - name: REDIS_PORT
              value: "6379"
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
