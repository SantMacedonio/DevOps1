apiVersion: apps/v1
kind: Deployment
metadata:
  name: shape-game-green
  labels:
    app: shape-game
    version: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shape-game
      version: green
  template:
    metadata:
      labels:
        app: shape-game
        version: green
      annotations:
        # Descubrimiento automático por Prometheus (ver k8s/monitoring/prometheus.yaml)
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      # El pod no usa la API de Kubernetes: no montar el token de la ServiceAccount
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Reparte las réplicas en nodos distintos cuando hay más de uno.
      # "preferred" (no "required"): en minikube hay un solo nodo y con
      # "required" la segunda réplica quedaría en Pending.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: shape-game
                    version: green
      containers:
        - name: shape-game
          image: shape-game:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: APP_VERSION
              value: "v2.0.0"
            - name: APP_COLOR
              value: "green"
            - name: PRESTIGE_ENABLED
              value: "true"
            - name: REDIS_HOST
              value: "redis-service"
            - name: REDIS_PORT
              value: "6379"
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
