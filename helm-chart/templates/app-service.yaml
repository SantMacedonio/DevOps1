{{- /* El color activo tiene que existir y estar habilitado */ -}}
{{- $active := .Values.app.activeColor -}}
{{- $version := index .Values.app.versions $active | default dict -}}
{{- if not $version.enabled -}}
{{- fail (printf "app.activeColor=%q: esa versión no existe o no está habilitada en app.versions" $active) -}}
{{- end -}}
# Service de la app: es el "interruptor" Blue/Green. Su selector apunta solo a
# los pods del color activo (app.activeColor).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shape-game.fullname" . }}
  labels:
    {{- include "shape-game.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
  annotations:
    shape-game/active-color: {{ $active }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "shape-game.appSelectorLabels" . | nindent 4 }}
    version: {{ $active }}
