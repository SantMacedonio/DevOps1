{{- if .Values.ingress.enabled }}
# Ingress: expone la app por nombre de host (requiere un Ingress Controller,
# en minikube: "minikube addons enable ingress").
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "shape-game.fullname" . }}
  labels:
    {{- include "shape-game.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "shape-game.fullname" . }}
                port:
                  name: http
{{- end }}
