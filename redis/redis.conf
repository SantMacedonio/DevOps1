# Configuración de Redis para Shape Popper
# Accesible solo dentro del cluster (Service ClusterIP), por eso se escucha en todas las interfaces.
bind 0.0.0.0
port 6379
protected-mode no

# Persistencia: Append Only File en el volumen /data (PVC en Kubernetes)
dir /data
appendonly yes
appendfsync everysec

# Límite de memoria acorde al limit del contenedor (256Mi)
maxmemory 200mb
maxmemory-policy noeviction

loglevel notice
