# =============================================================================
# Jenkins Configuration as Code (JCasC)
# Toda la configuración de Jenkins está acá: no se configura nada a mano.
# Los valores ${...} vienen de variables de entorno (archivo .env.jenkins, que
# NO se sube al repositorio) o de archivos montados en /run/secrets.
# =============================================================================
jenkins:
  systemMessage: "Shape Popper CI/CD - configurado con Jenkins Configuration as Code"
  # El pipeline corre en el propio controlador (proyecto local de un solo nodo).
  # En producción se usarían agentes separados (ver README).
  numExecutors: 2
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          name: "Administrador"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "http://localhost:8080/"

credentials:
  system:
    domainCredentials:
      - credentials:
          # Token de Snyk (análisis de dependencias)
          - string:
              scope: GLOBAL
              id: "snyk-token"
              description: "Snyk API token"
              secret: "${SNYK_TOKEN:-not-set}"
          # GitHub Container Registry (usuario + Personal Access Token con write:packages)
          - usernamePassword:
              scope: GLOBAL
              id: "ghcr"
              description: "GitHub Container Registry"
              username: "${GHCR_USER:-not-set}"
              password: "${GHCR_TOKEN:-not-set}"
          # kubeconfig de la ServiceAccount jenkins-deployer (permisos mínimos)
          - file:
              scope: GLOBAL
              id: "kubeconfig"
              description: "kubeconfig de jenkins-deployer (k8s/jenkins/rbac.yaml)"
              fileName: "kubeconfig"
              secretBytes: "${readFileBase64:/run/secrets/kubeconfig}"

jobs:
  - script: |
      pipelineJob('shape-game') {
        description('Pipeline CI/CD de Shape Popper: Semgrep, Snyk, tests, imagen Docker (Trivy) y despliegue con Helm. Definido en el Jenkinsfile del repositorio.')
        logRotator {
          numToKeep(20)
        }
        // Los mismos parámetros que declara el Jenkinsfile. Sin esto, cada vez
        // que Jenkins se reinicia el job se regenera sin parámetros y el primer
        // build no ofrece "Build with Parameters".
        parameters {
          choiceParam('DEPLOY_ENV', ['prod', 'dev'], 'prod: release "shape-game" (namespace default, Blue/Green). dev: release "shape-game-dev" (namespace shape-dev).')
          booleanParam('PUBLISH_IMAGE', false, 'true: publica la imagen en ghcr.io (credencial "ghcr"). false: la carga directo en minikube, sin registry.')
          booleanParam('SWITCH_TRAFFIC', true, 'Solo prod: pasar el tráfico a green después del smoke test.')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('${REPO_URL}')
                }
                branch('${REPO_BRANCH}')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(false)
          }
        }
      }
